version: "3.9"

services:
  whisper:
    build:
      context: .
      dockerfile: apps/whisper/Dockerfile
    image: dastyar-whisper:latest
    container_name: dastyar-whisper
    environment:
      - WHISPER_DEVICE=cpu
      - WHISPER_DEFAULT_MODEL=tiny
      - MAX_UPLOAD_MB=50
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 20s
      timeout: 3s
      retries: 5
      start_period: 10s

