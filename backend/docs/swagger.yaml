basePath: /api
definitions:
  db.ChatThread:
    properties:
      created_at:
        type: string
      id:
        type: integer
      is_archived:
        type: boolean
      messages:
        items:
          $ref: '#/definitions/db.Message'
        type: array
      model:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  db.Message:
    properties:
      chat_thread_id:
        type: integer
      content:
        type: string
      id:
        type: integer
      model:
        type: string
      reasoning:
        type: string
      role:
        type: string
      sent_at:
        type: string
      status:
        type: string
    type: object
  db.Translation:
    properties:
      created_at:
        type: string
      id:
        type: integer
      model:
        type: string
      source_language:
        type: string
      source_text:
        type: string
      target_language:
        type: string
      tone:
        type: string
      translated_text:
        type: string
    type: object
  handlers.ChatRequest:
    description: Request payload for sending a chat message
    properties:
      content:
        description: The message content to send
        example: Hello, how are you?
        type: string
      model:
        description: The model to use for the response
        example: llama3.2:latest
        type: string
      thread_id:
        description: The chat thread ID to send the message to
        example: "123"
        type: string
    required:
    - content
    - model
    - thread_id
    type: object
  handlers.ChatResponse:
    description: Response payload for a chat message (used in streaming)
    properties:
      content:
        description: The message content
        example: Hello! I'm doing well, thank you
        type: string
      id:
        description: Unique message ID
        example: 456
        type: integer
      model:
        description: Model used
        example: llama3.2:latest
        type: string
      reasoning:
        description: Reasoning content (for reasoning models)
        example: ""
        type: string
      role:
        description: Message role (user or assistant)
        example: assistant
        type: string
      sent_at:
        description: Timestamp when message was sent
        example: "2023-01-01T00:00:00Z"
        type: string
      status:
        description: Message status (idle, reasoning, responding, done)
        example: done
        type: string
      thread_id:
        description: Chat thread ID
        example: 123
        type: integer
    type: object
  handlers.CreateChatThreadRequest:
    description: Request payload for creating a new chat thread
    properties:
      model:
        description: The default model for this thread
        example: llama3.2:latest
        type: string
      title:
        description: The title of the chat thread
        example: My Chat with AI
        type: string
    required:
    - title
    type: object
  handlers.ErrorResponse:
    description: Standard error response format
    properties:
      message:
        description: Error message description
        example: Error message
        type: string
    type: object
  handlers.ModelListResponse:
    description: Information about an available model
    properties:
      details:
        additionalProperties: true
        description: Additional model details (format, family, etc.)
        type: object
      digest:
        description: Model digest/hash
        example: sha256:abc123...
        type: string
      modified_at:
        description: Last modification timestamp
        example: "2023-01-01T00:00:00Z"
        type: string
      name:
        description: Model name and tag
        example: llama3.2:latest
        type: string
      size:
        description: Model size in bytes
        example: 4661224676
        type: integer
    type: object
  handlers.PaginatedResponse-db_ChatThread:
    properties:
      current_page:
        description: Current page number
        type: integer
      data:
        description: Array of data items
        items:
          $ref: '#/definitions/db.ChatThread'
        type: array
      has_next:
        description: Whether there are more items available
        type: boolean
      has_previous:
        description: Whether there are previous items available
        type: boolean
      total:
        description: Total number of items
        type: integer
      total_pages:
        description: Total number of pages
        type: integer
    type: object
  handlers.PaginatedResponse-db_Message:
    properties:
      current_page:
        description: Current page number
        type: integer
      data:
        description: Array of data items
        items:
          $ref: '#/definitions/db.Message'
        type: array
      has_next:
        description: Whether there are more items available
        type: boolean
      has_previous:
        description: Whether there are previous items available
        type: boolean
      total:
        description: Total number of items
        type: integer
      total_pages:
        description: Total number of pages
        type: integer
    type: object
  handlers.PaginatedResponse-db_Translation:
    properties:
      current_page:
        description: Current page number
        type: integer
      data:
        description: Array of data items
        items:
          $ref: '#/definitions/db.Translation'
        type: array
      has_next:
        description: Whether there are more items available
        type: boolean
      has_previous:
        description: Whether there are previous items available
        type: boolean
      total:
        description: Total number of items
        type: integer
      total_pages:
        description: Total number of pages
        type: integer
    type: object
  handlers.Response-any:
    properties:
      data:
        description: The response data
    type: object
  handlers.Response-array_handlers_ModelListResponse:
    properties:
      data:
        description: The response data
        items:
          $ref: '#/definitions/handlers.ModelListResponse'
        type: array
    type: object
  handlers.Response-db_ChatThread:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/db.ChatThread'
        description: The response data
    type: object
  handlers.Response-db_Translation:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/db.Translation'
        description: The response data
    type: object
  handlers.Response-string:
    properties:
      data:
        description: The response data
        type: string
    type: object
  handlers.TranslateRequest:
    description: Request payload for translating text between languages
    properties:
      model:
        description: The model to use for translation
        example: llama3.2:latest
        type: string
      source_language:
        description: Source language code (e.g., 'fa', 'en', 'ar')
        example: fa
        type: string
      source_text:
        description: The text to be translated
        example: سلام دنیا
        type: string
      target_language:
        description: Target language code (e.g., 'fa', 'en', 'ar')
        example: en
        type: string
      thread_id:
        description: The thread ID for this translation
        example: "123"
        type: string
      tone:
        description: Translation tone (formal, casual, technical, friendly)
        example: formal
        type: string
    required:
    - model
    - source_language
    - source_text
    - target_language
    - thread_id
    type: object
  handlers.UpdateChatThreadRequest:
    description: Request payload for updating an existing chat thread
    properties:
      is_archived:
        description: Whether the chat thread is archived
        example: false
        type: boolean
      title:
        description: The new title for the chat thread
        example: Updated Chat Title
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: A comprehensive AI Assistant API that provides chat functionality,
    translation services, and model management. This API supports streaming chat responses,
    multi-language translation with tone control, and chat thread management.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Persian AI Assistant API
  version: "1.0"
paths:
  /chat:
    post:
      consumes:
      - application/json
      description: Send a message to an AI model and receive a streamed response.
        This endpoint supports both standard and reasoning models. For reasoning models,
        the response includes thinking process in the reasoning field. The response
        is streamed as NDJSON (newline-delimited JSON) for real-time updates.
      operationId: sendChatMessage
      parameters:
      - description: Chat request payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ChatRequest'
      produces:
      - application/x-ndjson
      responses:
        "200":
          description: Streamed chat response (NDJSON format)
          schema:
            $ref: '#/definitions/handlers.ChatResponse'
        "400":
          description: Bad request - missing required fields
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Chat thread not found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal server error - model or database error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Stream chat response
      tags:
      - Chat
  /chat-threads:
    get:
      description: Retrieve a paginated list of all chat threads, ordered by last
        update time (newest first)
      operationId: getChatThreads
      parameters:
      - description: Whether the chat thread is archived
        in: query
        name: is_archived
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: List of chat threads with pagination info
          schema:
            $ref: '#/definitions/handlers.PaginatedResponse-db_ChatThread'
        "500":
          description: Internal server error - database error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Get all chat threads
      tags:
      - Chat Threads
    post:
      consumes:
      - application/json
      description: Create a new chat thread with a title and default model. This thread
        will be used to organize related chat messages.
      operationId: createChatThread
      parameters:
      - description: Chat thread details
        in: body
        name: chat_thread
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateChatThreadRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Chat thread created successfully
          schema:
            $ref: '#/definitions/handlers.Response-db_ChatThread'
        "400":
          description: Bad request - missing required fields
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal server error - database error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Create a new chat thread
      tags:
      - Chat Threads
  /chat-threads/{id}:
    delete:
      description: Delete a chat thread and all associated messages. This action cannot
        be undone.
      operationId: deleteChatThread
      parameters:
      - description: Chat thread ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Chat thread deleted successfully
          schema:
            $ref: '#/definitions/handlers.Response-any'
        "404":
          description: Chat thread not found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal server error - database error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Delete a chat thread
      tags:
      - Chat Threads
    get:
      description: Retrieve a specific chat thread by its unique identifier, including
        all associated messages
      operationId: getChatThread
      parameters:
      - description: Chat thread ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Chat thread details with messages
          schema:
            $ref: '#/definitions/handlers.Response-db_ChatThread'
        "404":
          description: Chat thread not found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal server error - database error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Get a chat thread by ID
      tags:
      - Chat Threads
    put:
      consumes:
      - application/json
      description: Update the title of an existing chat thread. The updated_at timestamp
        will be automatically updated.
      operationId: updateChatThread
      parameters:
      - description: Chat thread ID
        in: path
        name: id
        required: true
        type: string
      - description: Chat thread details
        in: body
        name: chat_thread
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateChatThreadRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Chat thread updated successfully
          schema:
            $ref: '#/definitions/handlers.Response-db_ChatThread'
        "400":
          description: Bad request - missing required fields
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Chat thread not found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal server error - database error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Update a chat thread
      tags:
      - Chat Threads
  /chat-threads/{id}/messages:
    get:
      description: Retrieve all messages in a chat thread, ordered by creation time
        (oldest first). Only user and assistant messages are returned.
      operationId: getChatThreadMessages
      parameters:
      - description: Chat thread ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of messages in the chat thread
          schema:
            $ref: '#/definitions/handlers.PaginatedResponse-db_Message'
        "404":
          description: Chat thread not found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal server error - database error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Get chat thread messages
      tags:
      - Chat Threads
  /health:
    get:
      consumes:
      - application/json
      description: Check if the application and Ollama service are running and accessible.
        Returns 'ok' if all services are healthy.
      operationId: healthCheck
      produces:
      - application/json
      responses:
        "200":
          description: Service is healthy
          schema:
            $ref: '#/definitions/handlers.Response-string'
        "500":
          description: Service is unhealthy - Ollama connection failed
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Health check endpoint
      tags:
      - Health
  /list-model:
    get:
      consumes:
      - application/json
      description: Get list of all available models from Ollama
      operationId: getModels
      produces:
      - application/json
      responses:
        "200":
          description: List of models
          schema:
            $ref: '#/definitions/handlers.Response-array_handlers_ModelListResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Get available models
      tags:
      - Model
  /translations:
    get:
      description: Retrieve a paginated list of all translation records, ordered by
        creation date (newest first)
      operationId: getTranslations
      produces:
      - application/json
      responses:
        "200":
          description: List of translations with pagination info
          schema:
            $ref: '#/definitions/handlers.PaginatedResponse-db_Translation'
        "500":
          description: Internal server error - database error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Get all translations
      tags:
      - Translations
    post:
      consumes:
      - application/json
      description: Translate text from one language to another using AI models. Supports
        multiple languages (Persian, English, Arabic, French, German, Spanish) and
        different tones (formal, casual, technical, friendly). The translation is
        processed synchronously and stored in the database.
      operationId: createTranslation
      parameters:
      - description: Translation request payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.TranslateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Translation completed successfully
          schema:
            $ref: '#/definitions/handlers.Response-db_Translation'
        "400":
          description: Bad request - missing required fields or invalid parameters
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Translation thread not found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal server error - model or database error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Create translation
      tags:
      - Translations
  /translations/{id}:
    get:
      description: Retrieve a specific translation record by its unique identifier
      operationId: getTranslation
      parameters:
      - description: Translation ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Translation details
          schema:
            $ref: '#/definitions/handlers.Response-db_Translation'
        "404":
          description: Translation not found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal server error - database error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Get translation by ID
      tags:
      - Translations
schemes:
- http
- https
securityDefinitions:
  BasicAuth:
    type: basic
swagger: "2.0"
