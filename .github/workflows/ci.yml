name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint:check

      - name: Type check
        run: bun run check-types

      - name: Test
        run: bun run test

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/whisper/go.mod

      # Only packages that do not use CGo. The rest needs whisper.cpp.
      - name: Test whisper (Go)
        working-directory: apps/whisper
        run: go test ./internal/stt ./internal/config ./internal/audio ./internal/handler

      - name: Build web
        run: bun run --cwd apps/web build
