[project]
name = "whisper-server"
version = "0.1.0"
description = "Simple FastAPI server for Whisper transcription"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "openai-whisper>=20231117",
  # Optional: helps resolve ffmpeg path when bundled; not required at runtime if ffmpeg is on PATH
  "imageio-ffmpeg>=0.4.9",
]

[tool.uv]
default-groups = ["default"]

[tool.uv.sources]

[tool.uv.workspace]
members = []
