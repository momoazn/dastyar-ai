[project]
name = "whisper-api"
version = "0.1.0"
description = "OpenAI Whisper transcription service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.116.1",
    "openai-whisper>=20250625",
]

[dependency-groups]
dev = [
    "ruff>=0.12.8",
]
build = [
    "pyinstaller>=6.11.1",
    "setuptools>=70.0.0",
    "jaraco.text>=3.7.0",
]
