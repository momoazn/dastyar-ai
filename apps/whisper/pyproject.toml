[project]
name = "whisperx-server"
version = "0.1.0"
description = "FastAPI server for WhisperX transcription"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi[standard]>=0.115.0",
  "whisperx",
  "pydantic-settings>=2.0.0",
  # Optional: helps resolve ffmpeg path when bundled; not required at runtime if ffmpeg is on PATH
  "imageio-ffmpeg>=0.4.9",
  # Use openai-whisper instead of whisper to avoid package name collision
  "openai-whisper>=1.1.10",
]

[tool.uv]

[tool.uv.sources]

[tool.uv.workspace]
members = []
