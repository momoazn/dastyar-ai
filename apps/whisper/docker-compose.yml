version: '3.8'

services:
  whisper-server:
    build: .
    container_name: whisper-server
    ports:
      - "8080:8080"
    volumes:
      - ./models:/app/models
      - ./temp:/app/temp
    environment:
      - PORT=8080
      - MODEL_PATH=/app/models
      - MODEL_NAME=ggml-base.bin
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
