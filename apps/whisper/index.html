<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Transcription</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 40px;
        max-width: 500px;
        width: 100%;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      h1 {
        color: #333;
        margin-bottom: 30px;
        font-size: 2rem;
        font-weight: 600;
      }

      .controls {
        margin-bottom: 30px;
      }

      .control-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: #555;
        text-align: left;
      }

      select {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e1e5e9;
        border-radius: 10px;
        font-size: 16px;
        background: white;
        transition: border-color 0.3s ease;
      }

      select:focus {
        outline: none;
        border-color: #667eea;
      }

      .record-section {
        margin: 30px 0;
      }

      .record-button {
        width: 120px;
        height: 120px;
        border: none;
        border-radius: 50%;
        background: linear-gradient(135deg, #ff6b6b, #ee5a24);
        color: white;
        font-size: 1.2rem;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        position: relative;
        overflow: hidden;
      }

      .record-button:hover {
        transform: scale(1.05);
      }

      .record-button.recording {
        background: linear-gradient(135deg, #ff4757, #c44569);
        animation: pulse 1.5s infinite;
      }

      .record-button.processing {
        background: linear-gradient(135deg, #5f27cd, #341f97);
        cursor: not-allowed;
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
        100% {
          transform: scale(1);
        }
      }

      .status {
        margin: 20px 0;
        font-size: 1.1rem;
        font-weight: 500;
      }

      .status.idle {
        color: #666;
      }
      .status.recording {
        color: #ff4757;
      }
      .status.processing {
        color: #5f27cd;
      }
      .status.success {
        color: #2ed573;
      }
      .status.error {
        color: #ff4757;
      }

      .timer {
        font-size: 1.5rem;
        font-weight: 600;
        color: #ff4757;
        margin: 10px 0;
      }

      .result-section {
        margin-top: 30px;
        text-align: left;
      }

      .result {
        background: #f8f9fa;
        border-left: 4px solid #667eea;
        padding: 20px;
        border-radius: 10px;
        margin-top: 15px;
        white-space: pre-wrap;
        word-wrap: break-word;
        font-size: 1.1rem;
        line-height: 1.6;
        direction: ltr;
      }

      .result.persian {
        direction: rtl;
        text-align: right;
        border-left: none;
        border-right: 4px solid #667eea;
      }

      .meta-info {
        background: #e9ecef;
        padding: 15px;
        border-radius: 8px;
        margin-top: 15px;
        font-size: 0.9rem;
        color: #666;
      }

      .meta-item {
        margin: 5px 0;
      }

      .error {
        background: #ffe6e6;
        border: 1px solid #ff9999;
        color: #cc0000;
        padding: 15px;
        border-radius: 8px;
        margin-top: 15px;
      }

      .loading {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid #f3f3f3;
        border-top: 3px solid #667eea;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-right: 10px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .api-status {
        position: absolute;
        top: 20px;
        right: 20px;
        padding: 5px 10px;
        border-radius: 15px;
        font-size: 0.8rem;
        font-weight: 500;
      }

      .api-status.online {
        background: #d4edda;
        color: #155724;
      }

      .api-status.offline {
        background: #f8d7da;
        color: #721c24;
      }

      @media (max-width: 600px) {
        .container {
          padding: 30px 20px;
          margin: 10px;
        }

        h1 {
          font-size: 1.5rem;
        }

        .record-button {
          width: 100px;
          height: 100px;
        }
      }
    </style>
  </head>
  <body>
    <div class="api-status" id="apiStatus">Checking API...</div>

    <div class="container">
      <h1>🎤 Voice Transcription</h1>

      <div class="controls">
        <div class="control-group">
          <label for="modelSelect">Model:</label>
          <select id="modelSelect">
            <option value="tiny">Tiny (Fastest)</option>
            <option value="base" selected>Base (Recommended)</option>
            <option value="small">Small (Better Quality)</option>
            <option value="medium">Medium (High Quality)</option>
            <option value="large-v3">Large (Best Quality)</option>
          </select>
        </div>

        <div class="control-group">
          <label for="engineSelect">Engine:</label>
          <select id="engineSelect">
            <option value="faster" selected>Faster Whisper</option>
            <option value="openai">OpenAI Whisper</option>
          </select>
        </div>

        <div class="control-group">
          <label for="languageSelect">Language:</label>
          <select id="languageSelect">
            <option value="auto">Auto Detect</option>
            <option value="en" selected>English</option>
            <option value="fa">Persian (فارسی)</option>
          </select>
        </div>
      </div>

      <div class="record-section">
        <button id="recordButton" class="record-button">
          <span id="recordIcon">🎙️</span>
        </button>
        <div id="status" class="status idle">Click to start recording</div>
        <div id="timer" class="timer" style="display: none">00:00</div>
      </div>

      <div id="resultSection" class="result-section" style="display: none">
        <h3>Transcription Result:</h3>
        <div id="result" class="result"></div>
        <div id="metaInfo" class="meta-info"></div>
      </div>

      <div id="error" class="error" style="display: none"></div>
    </div>

    <script>
      class VoiceRecorder {
        constructor() {
          this.mediaRecorder = null;
          this.audioChunks = [];
          this.isRecording = false;
          this.startTime = null;
          this.timerInterval = null;
          this.stream = null;

          this.recordButton = document.getElementById("recordButton");
          this.recordIcon = document.getElementById("recordIcon");
          this.status = document.getElementById("status");
          this.timer = document.getElementById("timer");
          this.resultSection = document.getElementById("resultSection");
          this.result = document.getElementById("result");
          this.metaInfo = document.getElementById("metaInfo");
          this.error = document.getElementById("error");
          this.modelSelect = document.getElementById("modelSelect");
          this.languageSelect = document.getElementById("languageSelect");
          this.engineSelect = document.getElementById("engineSelect");
          this.apiStatus = document.getElementById("apiStatus");

          this.apiBaseUrl = "http://localhost:8000"; // Change this to your API URL

          this.init();
        }

        async init() {
          this.recordButton.addEventListener("click", () =>
            this.toggleRecording()
          );
          await this.checkApiStatus();

          // Check API status every 30 seconds
          setInterval(() => this.checkApiStatus(), 30000);
        }

        async checkApiStatus() {
          try {
            const response = await fetch(`${this.apiBaseUrl}/api/health`);
            if (response.ok) {
              this.apiStatus.textContent = "API Online";
              this.apiStatus.className = "api-status online";
            } else {
              throw new Error("API not responding");
            }
          } catch (error) {
            this.apiStatus.textContent = "API Offline";
            this.apiStatus.className = "api-status offline";
          }
        }

        async toggleRecording() {
          if (this.isRecording) {
            this.stopRecording();
          } else {
            await this.startRecording();
          }
        }

        async startRecording() {
          try {
            this.hideError();
            this.hideResult();

            this.stream = await navigator.mediaDevices.getUserMedia({
              audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true,
              },
            });

            this.mediaRecorder = new MediaRecorder(this.stream, {
              mimeType: "audio/webm;codecs=opus",
            });

            this.audioChunks = [];

            this.mediaRecorder.ondataavailable = (event) => {
              if (event.data.size > 0) {
                this.audioChunks.push(event.data);
              }
            };

            this.mediaRecorder.onstop = () => {
              this.processRecording();
            };

            this.mediaRecorder.start();
            this.isRecording = true;

            this.updateUI("recording");
            this.startTimer();
          } catch (error) {
            this.showError("Failed to access microphone: " + error.message);
          }
        }

        stopRecording() {
          if (this.mediaRecorder && this.mediaRecorder.state !== "inactive") {
            this.mediaRecorder.stop();
          }

          if (this.stream) {
            this.stream.getTracks().forEach((track) => track.stop());
          }

          this.isRecording = false;
          this.stopTimer();
          this.updateUI("processing");
        }

        startTimer() {
          this.startTime = Date.now();
          this.timer.style.display = "block";

          this.timerInterval = setInterval(() => {
            const elapsed = Math.floor((Date.now() - this.startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            this.timer.textContent = `${minutes
              .toString()
              .padStart(2, "0")}:${seconds.toString().padStart(2, "0")}`;
          }, 1000);
        }

        stopTimer() {
          if (this.timerInterval) {
            clearInterval(this.timerInterval);
            this.timerInterval = null;
          }
          this.timer.style.display = "none";
        }

        updateUI(state) {
          this.recordButton.className = `record-button ${state}`;

          switch (state) {
            case "recording":
              this.recordIcon.textContent = "⏹️";
              this.status.textContent = "Recording... Click to stop";
              this.status.className = "status recording";
              break;
            case "processing":
              this.recordIcon.innerHTML = '<div class="loading"></div>';
              this.status.textContent = "Processing...";
              this.status.className = "status processing";
              break;
            case "idle":
              this.recordIcon.textContent = "🎙️";
              this.status.textContent = "Click to start recording";
              this.status.className = "status idle";
              break;
            case "success":
              this.recordIcon.textContent = "✅";
              this.status.textContent = "Transcription completed!";
              this.status.className = "status success";
              setTimeout(() => this.updateUI("idle"), 3000);
              break;
            case "error":
              this.recordIcon.textContent = "❌";
              this.status.textContent = "Error occurred";
              this.status.className = "status error";
              setTimeout(() => this.updateUI("idle"), 3000);
              break;
          }
        }

        async processRecording() {
          try {
            const audioBlob = new Blob(this.audioChunks, {
              type: "audio/webm",
            });
            await this.sendToAPI(audioBlob);
          } catch (error) {
            this.showError("Failed to process recording: " + error.message);
            this.updateUI("error");
          }
        }

        async sendToAPI(audioBlob) {
          const formData = new FormData();
          formData.append("file", audioBlob, "recording.webm");

          const model = this.modelSelect.value;
          const engine = this.engineSelect.value;
          const language =
            this.languageSelect.value === "auto"
              ? ""
              : this.languageSelect.value;

          let url = `${this.apiBaseUrl}/api/transcribe?model=${model}&engine=${engine}&response_format=verbose&include_timestamps=true`;
          if (language) {
            url += `&language=${language}`;
          }

          try {
            const response = await fetch(url, {
              method: "POST",
              body: formData,
            });

            if (!response.ok) {
              const errorData = await response.json();
              throw new Error(errorData.detail || "API request failed");
            }

            const data = await response.json();
            this.showResult(data);
            this.updateUI("success");
          } catch (error) {
            this.showError("API Error: " + error.message);
            this.updateUI("error");
          }
        }

        showResult(data) {
          this.hideError();

          this.result.textContent = data.text;

          // Apply Persian styling if detected language is Persian
          if (data.language === "fa" || this.languageSelect.value === "fa") {
            this.result.className = "result persian";
          } else {
            this.result.className = "result";
          }

          // Show meta information
          let metaHtml = `
                    <div class="meta-item"><strong>Language:</strong> ${
                      data.language || "Unknown"
                    }</div>
                    <div class="meta-item"><strong>Engine:</strong> ${
                      this.engineSelect.value
                    }</div>
                    <div class="meta-item"><strong>Model:</strong> ${
                      data.model_used
                    }</div>
                    ${
                      typeof data.processing_ms === "number"
                        ? `<div class="meta-item"><strong>Processing Time:</strong> ${data.processing_ms} ms</div>`
                        : ""
                    }
                `;

          if (data.duration) {
            metaHtml += `<div class="meta-item"><strong>Duration:</strong> ${data.duration.toFixed(
              1
            )}s</div>`;
          }

          if (data.segments && data.segments.length > 0) {
            metaHtml += `<div class="meta-item"><strong>Segments:</strong> ${data.segments.length}</div>`;
          }

          this.metaInfo.innerHTML = metaHtml;
          this.resultSection.style.display = "block";
        }

        showError(message) {
          this.error.textContent = message;
          this.error.style.display = "block";
        }

        hideError() {
          this.error.style.display = "none";
        }

        hideResult() {
          this.resultSection.style.display = "none";
        }
      }

      // Initialize the recorder when the page loads
      document.addEventListener("DOMContentLoaded", () => {
        new VoiceRecorder();
      });
    </script>
  </body>
</html>
